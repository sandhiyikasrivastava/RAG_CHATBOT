<!-- BEGIN: Interactive Micro-behavior Script -->
<script data-purpose="chat-interactive-handlers">
    // Handle suggestion chip clicks into textarea
    document.querySelectorAll('button[class*="text-[12px]"]').forEach(btn => {
      btn.addEventListener('click', function() {
        const textarea = document.querySelector('textarea');
        if (textarea) {
          const text = this.innerText.replace(/^[^\w]+/, '').trim();
          textarea.value = text;
          textarea.focus();
        }
      });
    });
  </script>
<!-- END: Interactive Micro-behavior Script -->
